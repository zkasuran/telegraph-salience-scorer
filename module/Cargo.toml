[package]
name = "telegraph-scorer"
version = "0.1.0"
edition = "2021"

[lib]
name = "telegraph_scorer"
crate-type = ["cdylib"]

[features]
# CHAT_COMPLETION build only: compiles minilm.rs and embeds the 23 MB transformer blob.
# The 31 lexical builds omit it entirely.
minilm = []

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
